version: '3'

services:
  odoo-mock:
    build: .
    restart: unless-stopped
    environment:
      - RTS_BASE_URL=${RTS_BASE_URL}
      - ODOO_SHARED_SECRET=${ODOO_SHARED_SECRET}
      - ODOO_WEBHOOK_SECRET=${ODOO_WEBHOOK_SECRET}
      - MOCK_PUBLIC_URL=${MOCK_PUBLIC_URL}
    ports:
      - "5050:5050"
    networks:
      - odoo-mock-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo-mock.rule=Host(`odoo-mock.yourdomain.com`)"
      - "traefik.http.routers.odoo-mock.entrypoints=websecure"
      - "traefik.http.routers.odoo-mock.tls.certresolver=myresolver"
      - "traefik.http.services.odoo-mock.loadbalancer.server.port=5050"

networks:
  odoo-mock-net:
    driver: bridge
